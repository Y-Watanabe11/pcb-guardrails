[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pcb-guardrails"
version = "0.2.1"
description = "Independent checks of what the PCB fab actually receives (Gerber + drill vs. schematic netlist), for AI-assisted and human PCB design."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Yuki Watanabe" }]
requires-python = ">=3.10"
dependencies = ["shapely>=2.0", "sexpdata>=1.0"]
keywords = ["pcb", "gerber", "kicad", "netlist", "dfm", "ai-agents"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
pcb-guardrails = "pcb_guardrails.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
