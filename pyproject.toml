[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pcb-guardrails"
version = "0.2.2"
description = "Independent checks of what the PCB fab actually receives (Gerber + drill vs. schematic netlist), for AI-assisted and human PCB design."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Yuki Watanabe" }]
requires-python = ">=3.10"
dependencies = ["shapely>=2.0", "sexpdata>=1.0"]
keywords = ["pcb", "gerber", "kicad", "netlist", "dfm", "ai-agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]

[project.urls]
Homepage = "https://github.com/Y-Watanabe11/pcb-guardrails"
Issues = "https://github.com/Y-Watanabe11/pcb-guardrails/issues"
Changelog = "https://github.com/Y-Watanabe11/pcb-guardrails/blob/main/CHANGELOG.md"
DOI = "https://doi.org/10.5281/zenodo.24185580"

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
pcb-guardrails = "pcb_guardrails.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
